workflows:
  ios-simulator-build:
    name: WidgetKit Demo Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build app for simulator
        script: |
          xcodebuild \
            -project "WidgetKit Demo.xcodeproj" \
            -scheme "WidgetKit Demo" \
            -configuration Debug \
            -sdk iphonesimulator \
            build

    artifacts:
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.appex

  ios-ipa-build:
    name: WidgetKit Demo IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: pl.wojciechkulik.WidgetKit-Demo

    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles --project "WidgetKit Demo.xcodeproj"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "WidgetKit Demo.xcodeproj" \
            --scheme "WidgetKit Demo"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
